      h += '</section>';
      d.sections.forEach(function (s) {
        h += '<section class="block"><h2>' + e(s.h) + '</h2><div class="prose">';
        s.p.forEach(function (t) { h += '<p>' + e(t) + '</p>'; });
        h += '</div></section>';
      });

      document.getElementById("page").innerHTML = h;
