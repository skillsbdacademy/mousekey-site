<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skills BD App Studio – Apps by Skills BD Academy</title>
  <meta name="description" content="Download apps by Skills BD Academy, including Wireless Mouse &amp; Keyboard for Android and Windows.">
  <meta name="theme-color" content="#0F1220">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="site.js"></script>
</head>
<body>
  <div id="site-header"></div>

  <main class="wrap">
    <section class="hero">
      <h1 id="h-title"></h1>
      <p id="h-text"></p>
    </section>

    <div class="grid" id="grid"></div>

    <!-- Ad slot: after Adsterra approval, paste the banner code inside this div and add class "on" -->
    <div class="ad-slot" id="ad-home"></div>
  </main>

  <div id="site-footer"></div>

  <script>
    Site.init(function (data) {
      document.getElementById("h-title").textContent = Site.ui("heroTitle");
      document.getElementById("h-text").textContent = Site.ui("heroText");

      var html = "";
      data.apps.forEach(function (a) {
        html +=
          '<a class="app-card" href="app.html?id=' + encodeURIComponent(a.id) + '">' +
          '<img src="' + Site.esc(a.icon) + '" alt="" width="72" height="72">' +
          '<div><h3>' + Site.esc(a.name) + '</h3>' +
          '<small>' + Site.esc(a.developer) + ' · ' + Site.esc(Site.ui("version")) + ' ' + Site.esc(a.version) + '</small>' +
          '<div><small>' + Site.esc(Site.t(a.short)) + '</small></div></div></a>';
      });
      document.getElementById("grid").innerHTML = html;
    });
  </script>
</body>
</html>
